[package]
name = "xkbflag-rs"
version = "0.1.0"
edition = "2021"
description = "Плавающий флаг раскладки клавиатуры у курсора (KDE/X11)"
license = "MIT"
authors = ["Muga Aleksandr <sasha_muga@mail.ru>"]
repository = "https://github.com/teraxl/kbdflag"

[dependencies]
eframe = "0.28"
egui = "0.28"
rdev = "0.5"
crossbeam-channel = "0.5"
ksni = "0.2"
raw-window-handle = "0.6"
resvg = "0.42"
tiny-skia = "0.11"

[build-dependencies]
cc = "1"
